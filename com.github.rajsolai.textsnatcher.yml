id: com.github.rajsolai.textsnatcher
runtime: org.gnome.Platform
runtime-version: '50'
base: io.elementary.BaseApp
base-version: circe-25.08
sdk: org.gnome.Sdk
command: com.github.rajsolai.textsnatcher
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --system-talk-name=org.freedesktop.Accounts
cleanup:
  - /lib/cmake
  - /share/bash-completion
  - /share/doc
  - /share/man
  - /share/zsh
  - '*.la'
  - '*.a'
cleanup-commands:
  - rm -rf /app/bin/sassc
  - rm -rf /app/include
  - rm -rf /app/lib/girepository-1.0
  - rm -rf /app/lib/pkgconfig
  - rm -rf /app/share/gir-1.0
  - rm -rf /app/share/vala
  - rm -rf /app/lib/libgee*
  - rm -rf /app/lib/libsass*
modules:

  # Dependency of libbsd
  - name: libmd
    sources:
      - type: archive
        url: https://libbsd.freedesktop.org/releases/libmd-1.2.0.tar.xz
        sha256: ac15ffb8430502fbaccdec66c5a82ee0eab0b0f36220df56710feadfeb13d0a0
        x-checker-data:
          type: anitya
          project-id: 15525
          stable-only: true
          url-template: https://libbsd.freedesktop.org/releases/libmd-$version.tar.xz

  - name: libbsd
    sources:
      - type: archive
        url: https://libbsd.freedesktop.org/releases/libbsd-0.12.2.tar.xz
        sha256: b88cc9163d0c652aaf39a99991d974ddba1c3a9711db8f1b5838af2a14731014
        x-checker-data:
          type: anitya
          project-id: 1567
          stable-only: true
          url-template: https://libbsd.freedesktop.org/releases/libbsd-$version.tar.xz

  - name: imlib2
    buildsystem: autotools
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/enlightenment/imlib2-src/1.12.6/imlib2-1.12.6.tar.gz
        sha256: 59743ce82aefa9c1ec9476af608d541b74164714d2928fbd84ff5db6c4399079
        x-checker-data:
          type: anitya
          project-id: 21676
          url-template: https://downloads.sourceforge.net/project/enlightenment/imlib2-src/$version/imlib2-$version.tar.gz

  - name: scrot
    sources:
      - type: archive
        archive-type: tar-gzip
        url: https://api.github.com/repos/resurrecting-open-source-projects/scrot/tarball/2.0.0
        sha256: 1cedbb9a6fb8a2aec3a7f35764db74acc1ea477e22e3cb5b8070ca278e34c83b
        x-checker-data:
          type: json
          url: https://api.github.com/repos/resurrecting-open-source-projects/scrot/releases/latest
          version-query: .tag_name
          url-query: .tarball_url

  - name: leptonica
    rm-configure: true
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.79.0/leptonica-1.79.0.tar.gz
        sha256: 045966c9c5d60ebded314a9931007a56d9d2f7a6ac39cb5cc077c816f62300d8

  - name: tesseract
    config-opts:
      - --disable-static
      - --disable-graphics
      - --enable-legacy
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/5.5.2.tar.gz
        sha256: 6235ea0dae45ea137f59c09320406f5888383741924d98855bd2ce0d16b54f21
        x-checker-data:
          type: anitya
          project-id: 4954
          stable-only: true
          url-template: https://github.com/tesseract-ocr/tesseract/archive/$version.tar.gz

  - name: tessdata-best
    buildsystem: simple
    build-commands:
      - install -Dm644 {deu,nld,tur,eng,jpn,rus,fra,ara,chi_sim,spa}.traineddata -t /app/share/tessdata/
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/eng.traineddata
        sha256: 8280aed0782fe27257a68ea10fe7ef324ca0f8d85bd2fd145d1c2b560bcb66ba
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/jpn.traineddata
        sha256: 36bdf9ac823f5911e624c30d0553e890b8abc7c31a65b3ef14da943658c40b79
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/rus.traineddata
        sha256: b617eb6830ffabaaa795dd87ea7fd251adfe9cf0efe05eb9a2e8128b7728d6b6
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/fra.traineddata
        sha256: 907743d98915c91a3906dfbf6e48b97598346698fe53aaa797e1a064ffcac913
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/ara.traineddata
        sha256: ab9d157d8e38ca00e7e39c7d5363a5239e053f5b0dbdb3167dde9d8124335896
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/chi_sim.traineddata
        sha256: 4fef2d1306c8e87616d4d3e4c6c67faf5d44be3342290cf8f2f0f6e3aa7e735b
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/spa.traineddata
        sha256: e2c1ffdad8b30f26c45d4017a9183d3a7f9aa69e59918be4f88b126fac99ab2c
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/tur.traineddata
        sha256: e0c3338dc17503dc7d335a507c9ae01b2b46cfd07561171e1e1ac55d85e8e438
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/nld.traineddata
        sha256: 92e7a1ad4bf8082e268de57c7823316ec024935702c6ed2a1e473b3a071aa733
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_best/raw/main/deu.traineddata
        sha256: 8407331d6aa0229dc927685c01a7938fc5a641d1a9524f74838cdac599f0d06e

  - name: com.github.rajsolai.textsnatcher
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/muelli/TextSnatcher.git
        commit: 5d771056436ace7babbbbe259f5abeaa4c1a6103
